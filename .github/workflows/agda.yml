name: Agda type check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Agda
        run: |
          sudo apt-get update
          sudo apt-get install -y agda-bin
          agda --version
      - name: Check all proofs in safe mode
        run: agda --safe --without-K Portfolio.agda
